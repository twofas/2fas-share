name: Check licenses (headers and summaries)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop"]

jobs:
  licenses:
    if: ${{ github.actor != 'dependabot[bot]' }} # Skip for dependabot, handled in separate workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test if go.mod and go.sum are up to date
        run: |
          go mod tidy
          git diff --exit-code
      - name: Check if licence headers are up to date
        run: |
          make check-license-headers
      - name: Check is api vendor licenses file is up to date
        run: |
          make api-licenses
          git diff --exit-code
