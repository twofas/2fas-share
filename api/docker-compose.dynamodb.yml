services:
  moto:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    ports:
      - "5555:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/moto-api/"]
      interval: 2s
      timeout: 2s
      retries: 10
  dynamo-init:
    image: amazon/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846
    depends_on:
      moto:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_ENDPOINT=http://moto:5000
    entrypoint: ["/bin/bash"]
    volumes:
      - ./scripts:/scripts
    command: ["/scripts/local-aws-init.sh"]
